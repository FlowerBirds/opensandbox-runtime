name: Build and Push Runtime Image

# Build Dockerfile_runtime for linux/amd64 and linux/arm64, tag as
# 1.0-rc3 and latest, and push to GitHub Container Registry (ghcr.io).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_rc:
        description: 'Release candidate tag (e.g. 1.0-rc3)'
        required: false
        default: '1.0-rc3'

env:
  REGISTRY: ghcr.io
  DOCKERFILE: Dockerfile_runtime

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve lowercase image name
        id: image
        run: |
          # GitHub owner is case-insensitive but Docker tags must be lowercase.
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/opensandbox-runtime" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ inputs.tag_rc || '1.0-rc3' }}
            ${{ steps.image.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=opensandbox-runtime
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
