name: Build and Push Runtime Image

# Build Dockerfile_runtime for linux/amd64 and linux/arm64, push the multi-arch
# image to GitHub Container Registry (ghcr.io), and on a v* tag push (or a
# workflow_dispatch with release=true) also publish a zstd-compressed tarball
# as a downloadable GitHub Release asset.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag_rc:
        description: 'Image tag (e.g. 1.0-rc3). Used on workflow_dispatch.'
        required: false
        default: '1.0-rc3'
      release:
        description: 'Also publish the .tar.zst as a GitHub Release asset.'
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  DOCKERFILE: Dockerfile_runtime

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed by softprops/action-gh-release
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image name and release tag
        id: meta
        run: |
          # GitHub owner is case-insensitive but Docker tags must be lowercase.
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/opensandbox-runtime" >>"$GITHUB_OUTPUT"

          # Pick the tag for this build:
          #   - tag push (refs/tags/vX.Y.Z)  -> the tag itself
          #   - workflow_dispatch           -> user-supplied tag_rc
          #   - branch push                 -> default 1.0-rc3
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag_rc }}"
          else
            TAG="1.0-rc3"
          fi
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=opensandbox-runtime
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PRIVATE_PYPI_URL=${{ vars.PRIVATE_PYPI_URL }}
            PRIVATE_PYPI_USERNAME=${{ vars.PRIVATE_PYPI_USERNAME }}
          secrets: |
            pypi_password=${{ secrets.PRIVATE_PYPI_PASSWORD }}

      # ---- Optional release asset: only on v* tag push or workflow_dispatch --release ----
      - name: Decide whether to publish a release
        id: relcond
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release }}" == "true" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build multi-arch tarball
        if: steps.relcond.outputs.should_release == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          outputs: type=tar,dest=opensandbox-runtime-${{ steps.meta.outputs.tag }}.tar
          build-args: |
            PRIVATE_PYPI_URL=${{ vars.PRIVATE_PYPI_URL }}
            PRIVATE_PYPI_USERNAME=${{ vars.PRIVATE_PYPI_USERNAME }}
          secrets: |
            pypi_password=${{ secrets.PRIVATE_PYPI_PASSWORD }}

      - name: Compress with zstd
        if: steps.relcond.outputs.should_release == 'true'
        run: |
          zstd -T0 -19 -f --rm \
            "opensandbox-runtime-${{ steps.meta.outputs.tag }}.tar" \
            -o "opensandbox-runtime-${{ steps.meta.outputs.tag }}.tar.zst"
          ls -lh "opensandbox-runtime-${{ steps.meta.outputs.tag }}.tar.zst"

      - name: Publish GitHub Release
        if: steps.relcond.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: opensandbox-runtime ${{ steps.meta.outputs.tag }}
          body: |
            ## 🚀 使用方法

            ### 方式一：直接拉取（推荐）

            适用于能访问 `ghcr.io` 的环境：

            ```bash
            docker pull ghcr.io/flowerbirds/opensandbox-runtime:${{ steps.meta.outputs.tag }}
            docker run --rm -it ghcr.io/flowerbirds/opensandbox-runtime:${{ steps.meta.outputs.tag }}
            ```

            ### 方式二：下载附件并离线导入

            适用于内网或隔离环境（需要 `zstd`，大多数 Linux 自带，macOS `brew install zstd`，Windows `winget install zstd`）：

            ```bash
            # 1. 下载本页底部附件
            curl -L -o opensandbox-runtime-${{ steps.meta.outputs.tag }}.tar.zst \
              https://github.com/FlowerBirds/opensandbox-runtime/releases/download/${{ steps.meta.outputs.tag }}/opensandbox-runtime-${{ steps.meta.outputs.tag }}.tar.zst

            # 2. 解压并导入到 Docker
            zstd -d opensandbox-runtime-${{ steps.meta.outputs.tag }}.tar.zst --stdout | docker load

            # 3. 验证
            docker images ghcr.io/flowerbirds/opensandbox-runtime:${{ steps.meta.outputs.tag }}
            docker run --rm ghcr.io/flowerbirds/opensandbox-runtime:${{ steps.meta.outputs.tag }}
            ```

            ### 镜像说明

            - **多架构**：`linux/amd64` + `linux/arm64`，`docker run` 时按宿主平台自动挑选
            - **基础镜像**：`python:3.12-slim`（Debian 12）
            - **默认入口**：`python`（无参数启动进入 REPL）
            - **预装系统工具**：`procps`（`ps`/`top`）、`file`、`tree`、`jq`、`unzip`、`zip`、`tar`、`curl`
            - **预装 Python 包**：`numpy`、`pandas`、`openpyxl`、`python-docx`、`python-pptx`、`markitdown`、`PyYAML`、`SQLAlchemy`、`PyMySQL`、`gmssl`（国密）、`requests`、`httpx`、`psutil`、`tqdm` 等
            - **私有包**：`tempo_oi`（如需使用请配置 `PRIVATE_PYPI_*` 变量/密钥后自行构建）
          generate_release_notes: true
          files: opensandbox-runtime-${{ steps.meta.outputs.tag }}.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}