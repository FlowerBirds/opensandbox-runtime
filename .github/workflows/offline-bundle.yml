name: Build opensandbox-server Offline Bundle

# Assemble an offline deployment bundle for opensandbox-server.
#
# The bundle contains three images:
#   opensandbox/server:v0.2.2                     -> opensandbox-server.tar.zst
#   opensandbox/execd:v1.0.22                     -> opensandbox-execd.tar.zst
#   ghcr.io/flowerbirds/opensandbox-runtime:latest -> opensandbox-runtime.tar.zst
#
# Each image is pulled for linux/amd64 (x86_64) and linux/arm64 (aarch64),
# exported with `docker save | zstd -T0 -19`, dropped into an
# opensandbox-offline-<version>.<arch>/ folder, and the folder is packaged
# into opensandbox-offline-<version>.<arch>.tar.gz.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (used in the folder / tarball name).'
        required: false
        default: '0.2.2'
      publish_release:
        description: 'Publish the tarballs as a GitHub Release asset.'
        type: boolean
        required: false
        default: true
  push:
    tags: ['opensandbox-offline-v*']

permissions:
  contents: read

env:
  SERVER_IMAGE: opensandbox/server:v0.2.2
  EXECD_IMAGE: opensandbox/execd:v1.0.22
  RUNTIME_IMAGE: ghcr.io/flowerbirds/opensandbox-runtime:latest

jobs:
  bundle:
    name: Bundle ${{ matrix.arch_label }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - docker_arch: amd64
            arch_label: x86_64
          - docker_arch: arm64
            arch_label: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve bundle name
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            # tag looks like opensandbox-offline-v0.2.2
            VERSION="${GITHUB_REF_NAME#opensandbox-offline-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            echo "::error::bundle version resolved to an empty string"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bundle=opensandbox-offline-${VERSION}.${{ matrix.arch_label }}" >> "$GITHUB_OUTPUT"

      - name: Ensure zstd is available
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd
          fi
          zstd --version

      # All three images are pulled anonymously: the ghcr.io package is public
      # and the Docker Hub images are not owned by this repo. No registry login.
      - name: Pull images for linux/${{ matrix.docker_arch }}
        run: |
          set -euo pipefail
          for img in "${SERVER_IMAGE}" "${EXECD_IMAGE}" "${RUNTIME_IMAGE}"; do
            docker pull --platform "linux/${{ matrix.docker_arch }}" "$img"
            arch="$(docker image inspect --format '{{.Architecture}}' "$img")"
            if [[ "$arch" != "${{ matrix.docker_arch }}" ]]; then
              echo "::error::${img} resolved to ${arch}, expected ${{ matrix.docker_arch }} — image has no such platform"
              exit 1
            fi
          done

      - name: Export images and package the bundle
        run: |
          set -euo pipefail
          BUNDLE="${{ steps.meta.outputs.bundle }}"
          mkdir -p "$BUNDLE"
          docker save "${RUNTIME_IMAGE}" | zstd -T0 -19 -f -o "$BUNDLE/opensandbox-runtime.tar.zst"
          docker save "${SERVER_IMAGE}"  | zstd -T0 -19 -f -o "$BUNDLE/opensandbox-server.tar.zst"
          docker save "${EXECD_IMAGE}"   | zstd -T0 -19 -f -o "$BUNDLE/opensandbox-execd.tar.zst"
          tar -czf "${BUNDLE}.tar.gz" "$BUNDLE"
          ls -lh "$BUNDLE" "${BUNDLE}.tar.gz"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.bundle }}
          path: ${{ steps.meta.outputs.bundle }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: bundle
    if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish_release == true
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#opensandbox-offline-v}"
          else
            VERSION="${{ inputs.version }}"
            TAG="opensandbox-offline-${VERSION#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opensandbox-offline-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: opensandbox-server offline bundle
          body: |
            ## 📦 离线部署包

            包含 `opensandbox/server`、`opensandbox/execd`、`opensandbox-runtime` 三个镜像的离线包，
            按架构分为两个附件。

            ### 附件

            | 附件 | 架构 | 适用主机 |
            |------|------|----------|
            | `opensandbox-offline-${{ steps.meta.outputs.version }}.x86_64.tar.gz` | `linux/amd64` | x86_64 / amd64 |
            | `opensandbox-offline-${{ steps.meta.outputs.version }}.aarch64.tar.gz` | `linux/arm64` | aarch64 / arm64 |

            每个压缩包内的目录结构：

            ```
            opensandbox-offline-${{ steps.meta.outputs.version }}.x86_64/
            ├── opensandbox-server.tar.zst    # opensandbox/server:v0.2.2
            ├── opensandbox-execd.tar.zst     # opensandbox/execd:v1.0.22
            └── opensandbox-runtime.tar.zst   # ghcr.io/flowerbirds/opensandbox-runtime:latest
            ```

            ### 使用方法

            ```bash
            # 1. 解压外层压缩包
            tar -xzf opensandbox-offline-${{ steps.meta.outputs.version }}.x86_64.tar.gz
            cd opensandbox-offline-${{ steps.meta.outputs.version }}.x86_64

            # 2. 导入镜像（需要 zstd：Linux 自带，macOS `brew install zstd`，Windows `winget install zstd`）
            for f in *.tar.zst; do
              zstd -d "$f" --stdout | docker load
            done

            # 3. 验证
            docker images | grep -E 'opensandbox/(server|execd)|opensandbox-runtime'
            ```

            > ⚠️ 请选择与目标主机架构一致的压缩包，x86_64 与 aarch64 的镜像不可混用。
          generate_release_notes: true
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
